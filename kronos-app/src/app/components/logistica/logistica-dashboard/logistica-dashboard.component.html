<div class="container-fluid py-4 bg-light min-vh-100 font-sans">
  <div class="row justify-content-center">
    <div class="col-12 col-xl-10">
      
      <div class="mb-4">
        <h2 class="text-primary font-weight-bold border-bottom pb-2 uppercase tracking-tight">
          Panel de Alta: Clientes, Sucursales y Ciudades
        </h2>
      </div>

      <div class="row">
        
        <div class="col-md-7">
          
          <div class="card shadow-sm border-0 mb-4">
            <div class="card-header bg-white border-bottom py-3">
              <h5 class="mb-0 text-primary font-weight-bold uppercase small italic">
                <i class="bi bi-person-plus-fill mr-2"></i> Alta Cliente
              </h5>
            </div>
            <div class="card-body">
              <div class="form-group mb-0">
                <label class="small font-weight-bold text-secondary uppercase">Nombre Cliente</label>
                <input type="text" class="form-control bg-light border-0 shadow-none p-4 font-weight-bold" 
                       placeholder="Nombre completo o razón social">
              </div>
            </div>
          </div>

          <div class="card shadow-sm border-0">
            <div class="card-header bg-white border-bottom py-3">
              <h5 class="mb-0 text-primary font-weight-bold uppercase small italic">
                <i class="bi bi-geo-alt-fill mr-2"></i> Alta Sucursal
              </h5>
            </div>
            <div class="card-body">
              <div class="row">
                <div class="col-md-6 mb-3">
                  <label class="small font-weight-bold text-secondary uppercase">Nombre Sucursal</label>
                  <input type="text" class="form-control bg-light border-0 shadow-none font-weight-bold" 
                         placeholder="Ej: Planta Matriz">
                </div>
                <div class="col-md-6 mb-3">
                  <label class="small font-weight-bold text-secondary uppercase">Dirección</label>
                  <input type="text" class="form-control bg-light border-0 shadow-none font-weight-bold" 
                         placeholder="Calle, No. y Colonia">
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="col-md-5">
          <div class="card shadow-sm border-0 h-100">
            <div class="card-header bg-white border-bottom py-3">
              <h5 class="mb-0 text-primary font-weight-bold uppercase small italic">
                <i class="bi bi-building-fill mr-2"></i> Alta Ciudad / Estado
              </h5>
            </div>
            <div class="card-body">
              <div class="form-group mb-4">
                <label class="small font-weight-bold text-secondary uppercase">Estado</label>
                <select class="form-control bg-light border-0 shadow-none font-weight-bold custom-select-lg">
                  <option selected disabled>Seleccione Estado...</option>
                  <option>Aguascalientes</option>
                  <option>Guanajuato</option>
                  <option>Jalisco</option>
                  <option>Querétaro</option>
                </select>
              </div>

              <div class="form-group">
                <label class="small font-weight-bold text-secondary uppercase">Nombre Ciudad</label>
                <input type="text" class="form-control bg-light border-0 shadow-none font-weight-bold" 
                       placeholder="Nombre de la ciudad">
              </div>

              <div class="mt-5 p-4 border rounded border-dashed text-center text-muted">
                <i class="bi bi-info-circle mb-2 d-block"></i>
                <span class="small">Al guardar, los datos se vincularán automáticamente al nuevo cliente registrado.</span>
              </div>
            </div>
          </div>
        </div>

        <div class="col-12 mt-4">
          <div class="d-flex justify-content-end align-items-center bg-white p-3 rounded shadow-sm border">
            <button type="reset" class="btn btn-link text-secondary font-weight-bold mr-4 text-decoration-none small uppercase">
              Limpiar Todo
            </button>
            <button type="submit" class="btn btn-primary px-5 py-2 shadow font-weight-black uppercase tracking-wider">
              Guardar Registro Completo
            </button>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<style>
  /* Ajustes para simular el look limpio de la empresa pero en Angular */
  .font-weight-black { font-weight: 900; }
  .tracking-wider { letter-spacing: 0.05em; }
  input:focus, select:focus {
    background-color: #ffffff !important;
    box-shadow: 0 0 0 0.2rem rgba(0, 123, 255, 0.15) !important;
    border: 1px solid #007bff !important;
  }
  .card { transition: transform 0.2s; }
  .card:hover { transform: translateY(-2px); }
</style>
